  <rect width="64" height="64" rx="14" fill="#0A3D2C"/>
  <text x="32" y="46.4" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="600" font-size="40" fill="#FAF7F0">L</text>
</svg>
