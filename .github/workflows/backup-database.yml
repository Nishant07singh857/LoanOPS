name: Backup production database (weekly)

# Belt-and-braces pg_dump of the production database, complementing
# Neon's point-in-time history (only ~6 hours on the Free plan — not a
# backup strategy for a ledger). Runs weekly and on manual dispatch.
#
# The dump connection comes from the BACKUP_DATABASE_URL repository
# secret when it exists, and falls back to the existing
# PROD_DATABASE_URL secret when it does not — so weekly backups run
# even before a dedicated backup secret is added. Only when BOTH are
# missing does the job SKIP CLEANLY with a notice — it never fails
# and never invents a connection. No credential literal appears in
# this file; secrets are only ever referenced, and passed to pg_dump
# through the environment.
on:
  workflow_dispatch:
  schedule:
    # Mondays 02:30 UTC (08:00 IST) — off-peak for the borrower base.
    - cron: '30 2 * * 1'

jobs:
  pg-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Check backup configuration
        id: check
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -n "${BACKUP_DATABASE_URL}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${PROD_DATABASE_URL}" ]; then
            echo "::notice::BACKUP_DATABASE_URL secret is not set — falling back to the PROD_DATABASE_URL secret for this backup."
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Neither BACKUP_DATABASE_URL nor PROD_DATABASE_URL secret is set — skipping database backup. Add one under Settings → Secrets and variables → Actions to enable weekly backups."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump production database
        if: steps.check.outputs.configured == 'true'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -eo pipefail
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          echo "stamp=${stamp}" >> "$GITHUB_ENV"
          file="loanops-backup-${stamp}.sql.gz"
          # Resolve the dump source: dedicated backup secret wins, the
          # production secret is the fallback (same order as the check).
          # EXPORT it: `docker run -e DB_URL` copies only exported host
          # variables into the container — a plain shell variable leaves
          # pg_dump with an empty connection string (socket fallback).
          export DB_URL="${BACKUP_DATABASE_URL:-$PROD_DATABASE_URL}"
          # postgres:17 client — pg_dump must be >= the server version
          # (Neon runs newer majors than the CI database image).
          docker run --rm -e DB_URL postgres:17-alpine \
            sh -c 'pg_dump --no-owner --no-privileges "$DB_URL"' \
            | gzip > "$file"
          # Sanity gate: a failed or empty pg_dump must never be
          # uploaded as a "backup". pipefail above already fails the
          # step when pg_dump errors; this gate also catches a
          # successful-but-empty dump. Floor: an empty gzip stream is
          # ~20 bytes, while this schema's DDL alone compresses to
          # several KB — 1024 bytes sits safely between the two.
          gzip -t "$file"
          size="$(stat -c%s "$file")"
          tables="$(zcat "$file" | grep -c 'CREATE TABLE' || true)"
          echo "Backup sanity: ${size} bytes, ${tables} CREATE TABLE statements."
          if [ "$size" -lt 1024 ]; then
            echo "::error::Backup file is only ${size} bytes — refusing to upload an empty or near-empty dump."
            exit 1
          fi
          if [ "$tables" -eq 0 ]; then
            echo "::error::Backup contains no CREATE TABLE statements — refusing to upload a dump without schema."
            exit 1
          fi
          ls -lh loanops-backup-*.sql.gz

      - name: Upload backup artifact
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: loanops-db-backup-${{ env.stamp }}
          path: loanops-backup-*.sql.gz
          retention-days: 90
          if-no-files-found: error
